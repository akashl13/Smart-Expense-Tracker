{% extends 'base.html' %}{% block title %}Edit transaction | Smart Expense{% endblock %}{% block page_title %}Edit transaction{% endblock %}{% block content %}<section class="panel form-panel"><div class="panel-head"><div><h2>Update transaction</h2><p>Keep your financial picture accurate.</p></div><a href="{{ url_for('main.transactions') }}" class="btn btn-secondary">Cancel</a></div><form method="post" class="transaction-form"><div><label>Type<select name="type"><option value="expense" {% if transaction.type == 'expense' %}selected{% endif %}>Expense</option><option value="income" {% if transaction.type == 'income' %}selected{% endif %}>Income</option></select></label><label>Amount<input type="number" name="amount" min="0.01" step="0.01" value="{{ transaction.amount }}" required></label><label>Date<input type="date" name="transaction_date" value="{{ transaction.transaction_date.isoformat() }}" required></label></div><div><label>Description<input name="description" value="{{ transaction.description }}" required></label><label>Category<select name="category">{% for category in categories %}<option {% if transaction.category == category.name %}selected{% endif %}>{{ category.name }}</option>{% endfor %}<option {% if transaction.category == 'Other' %}selected{% endif %}>Other</option></select></label><label>Payment method<select name="payment_method">{% for method in ['UPI','Credit card','Debit card','Cash','Bank transfer','Other'] %}<option {% if transaction.payment_method == method %}selected{% endif %}>{{ method }}</option>{% endfor %}</select></label><button class="btn btn-primary">Update transaction <i class="fa-solid fa-check ms-2"></i></button></div></form></section>{% endblock %}
