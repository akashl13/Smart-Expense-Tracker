{% extends 'base.html' %}{% block title %}Profile | Smart Expense{% endblock %}{% block page_title %}Profile settings{% endblock %}{% block content %}<section class="panel form-panel profile-panel"><div class="profile-heading"><div class="avatar large">{{ current_user.name[0]|upper }}</div><div><h2>{{ current_user.name }}</h2><p>{{ current_user.email }}</p></div></div><hr><h2>Edit profile</h2><form method="post"><label>Display name<input name="name" value="{{ current_user.name }}" required></label><h2 class="mt-4">Change password</h2><label>Current password<input name="current_password" type="password"></label><label>New password<input name="new_password" type="password" minlength="8" placeholder="At least 8 characters"></label><button class="btn btn-primary">Save changes <i class="fa-solid fa-check ms-2"></i></button></form></section>{% endblock %}
